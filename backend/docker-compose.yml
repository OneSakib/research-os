services:
  db:
    image: postgres:15.3
    container_name: research_os_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-research_os_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_os_password}
      POSTGRES_DB: ${POSTGRES_DB:-research_os_db}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: